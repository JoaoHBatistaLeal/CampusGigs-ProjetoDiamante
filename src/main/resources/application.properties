spring.application.name=campus-gigs

# Datasource (fallback local; dentro do Docker usa as env do compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusgigs}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campusgigs}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:campusgigs}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - schema controlado só pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server
server.port=8080

logging.level.org.flywaydb=INFO