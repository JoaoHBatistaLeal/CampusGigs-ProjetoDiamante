spring.application.name=campus-gigs

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusgigs}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campusgigs}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:campusgigs}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=8080

logging.level.org.flywaydb=INFO

api.security.token.secret=${JWT_SECRET:campusgigs-super-secret-key-para-desenvolvimento-com-mais-de-32-caracteres}
api.security.token.expiration=7200000