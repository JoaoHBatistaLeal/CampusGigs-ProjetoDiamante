services:
  postgres:
    image: postgres:16-alpine
    container_name: campusgigs-db
    environment:
      POSTGRES_DB: campusgigs
      POSTGRES_USER: campusgigs
      POSTGRES_PASSWORD: campusgigs
    ports:
      - "5432:5432"
    volumes:
      - campusgigs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusgigs -d campusgigs"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: campusgigs-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campusgigs
      SPRING_DATASOURCE_USERNAME: campusgigs
      SPRING_DATASOURCE_PASSWORD: campusgigs
    ports:
      - "8080:8080"

volumes:
  campusgigs_pgdata: